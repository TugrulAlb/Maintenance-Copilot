apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maintenance-copilot-api
  namespace: maintenance-copilot
  labels:
    app.kubernetes.io/name: maintenance-copilot
    app.kubernetes.io/component: api
  annotations:
    # Adjust this annotation for your ingress controller, or remove it if TLS is
    # terminated by a cloud load balancer/API gateway.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: maintenance-copilot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maintenance-copilot-api
                port:
                  name: http
  tls:
    - hosts:
        - maintenance-copilot.example.com
      secretName: maintenance-copilot-tls
