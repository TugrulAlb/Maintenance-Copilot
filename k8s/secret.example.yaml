apiVersion: v1
kind: Secret
metadata:
  name: maintenance-copilot-secrets
  namespace: maintenance-copilot
  labels:
    app.kubernetes.io/name: maintenance-copilot
type: Opaque
stringData:
  # Template only. Replace these values outside git, or create the secret with:
  # kubectl -n maintenance-copilot create secret generic maintenance-copilot-secrets \
  #   --from-literal=AZURE_OPENAI_API_KEY=... \
  #   --from-literal=MAINTENANCE_COPILOT_API_KEYS=viewer-key,admin-key
  AZURE_OPENAI_API_KEY: "replace-me"
  MAINTENANCE_COPILOT_API_KEYS: "demo-user-key,demo-admin-key"
  MAINTENANCE_COPILOT_ADMIN_KEYS: "demo-admin-key"
