name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  smoke-check:
    name: Smoke Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Import FastAPI app
        run: python -c "from api.main import app; print(app.title)"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: smoke-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        # This build verifies the Dockerfile on every push/PR. It intentionally
        # does not push an image; registry publishing can be added later with
        # docker/login-action and environment-specific release rules.
        run: docker build -f docker/Dockerfile -t maintenance-copilot:${{ github.sha }} .
