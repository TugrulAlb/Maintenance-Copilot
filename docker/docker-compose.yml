services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      MAINTENANCE_COPILOT_ALLOW_PUBLIC: ${MAINTENANCE_COPILOT_ALLOW_PUBLIC:-false}
      MAINTENANCE_COPILOT_API_KEYS: ${MAINTENANCE_COPILOT_API_KEYS:-demo-user-key,demo-admin-key}
      MAINTENANCE_COPILOT_ADMIN_KEYS: ${MAINTENANCE_COPILOT_ADMIN_KEYS:-demo-admin-key}
      MAINTENANCE_COPILOT_API_KEY_ROLES: ${MAINTENANCE_COPILOT_API_KEY_ROLES:-demo-user-key:viewer,demo-admin-key:admin}
      MAINTENANCE_COPILOT_RATE_LIMIT_PER_MINUTE: ${MAINTENANCE_COPILOT_RATE_LIMIT_PER_MINUTE:-20}
      MAINTENANCE_COPILOT_CORS_ORIGINS: ${MAINTENANCE_COPILOT_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      # Persistent volumes keep mutable runtime data outside the image so restarts
      # do not wipe the SQLite database or the ChromaDB index.
      - maintenance_data:/app/data
      - chroma_data:/app/chroma_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on:
      - api
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  loki:
    image: grafana/loki:3.2.0
    ports:
      - "3100:3100"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/loki.yml"

  promtail:
    image: grafana/promtail:3.2.0
    depends_on:
      - api
      - loki
    volumes:
      # Promtail tails Docker's json-file logs and ships them to Loki. In a
      # Kubernetes deployment, the same pattern maps to a DaemonSet that tails
      # pod logs from each node.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
    command:
      - "-config.file=/etc/promtail/promtail.yml"

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      # Local demo only. Change these credentials in any real deployment.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  maintenance_data:
  chroma_data:
  prometheus_data:
  grafana_data:
  loki_data:
