global:
  # 15s is a practical default for a small demo: fast enough to see dashboard
  # trends while you run test queries, but not frequent enough to add meaningful
  # load to the FastAPI service.
  scrape_interval: 15s

scrape_configs:
  - job_name: "maintenance-copilot"
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials: demo-admin-key
    static_configs:
      - targets:
          - api:8000
